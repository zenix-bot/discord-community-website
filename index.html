<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0e;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 480px;
            text-align: center;
        }

        .discord-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;
            background: #5865f2;

            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .description {
            margin: 0 auto 28px;

            max-width: 380px;

            color: #a6a6ad;
            font-size: 16px;
            line-height: 1.6;
        }

        .join-button {
            display: inline-block;

            padding: 14px 26px;

            background: #5865f2;
            color: white;

            border-radius: 8px;

            text-decoration: none;
            font-size: 16px;
            font-weight: 600;

            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .join-button:hover {
            background: #4752c4;
            transform: translateY(-2px);
        }

        .join-button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;

            color: #66666f;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="discord-icon">
            💬
        </div>

        <h1>Join Our Discord</h1>

        <p class="description">
            Come hang out, chat, and be part of the community.
        </p>

        <a
            class="join-button"
            href="https://discord.gg/KMPWDcFV7J"
            target="_blank"
            rel="noopener noreferrer"
        >
            Join Discord
        </a>

        <div class="footer">
            See you there.
        </div>

    </main>

</body>
</html>
